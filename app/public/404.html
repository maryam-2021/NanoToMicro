<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | NanoToMicro</title>
    <meta name="description" content="The requested NanoToMicro page could not be found." />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0b1220" />
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #f8fafc; padding: 24px; }
      main { width: min(680px, 100%); border: 1px solid #263244; border-radius: 24px; background: #101827; padding: 48px 32px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.28); }
      .icon { width: 64px; height: 64px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 18px; border: 1px solid rgba(251,191,36,.35); background: rgba(251,191,36,.09); color: #fbbf24; font-size: 28px; font-weight: 900; }
      .code { color: #fbbf24; font-weight: 900; letter-spacing: .2em; text-transform: uppercase; font-size: 13px; }
      h1 { margin: 8px 0 12px; font-size: clamp(32px, 7vw, 46px); line-height: 1.05; }
      p { margin: 0 auto; max-width: 540px; color: #aab4c4; line-height: 1.7; }
      nav { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 12px; text-decoration: none; font-weight: 800; font-size: 14px; }
      .primary { background: #fbbf24; color: #111827; }
      .secondary { border: 1px solid #334155; color: #f8fafc; background: #172033; }
      a:focus-visible { outline: 3px solid rgba(251,191,36,.45); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">?</div>
      <div class="code">404 error</div>
      <h1>Page not found</h1>
      <p>The URL may be mistyped, outdated, or no longer available. Return to NanoToMicro or browse the main conversion hub.</p>
      <nav aria-label="404 navigation">
        <a class="primary" href="/">Go to homepage</a>
        <a class="secondary" href="/nano-to-micro-conversion/">Conversion hub</a>
      </nav>
    </main>
  </body>
</html>
