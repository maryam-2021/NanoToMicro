name: Build & Internationalization Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, QA & Launch Audit
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate 52 i18n Dictionaries
        run: npm run i18n:check

      - name: Run RTL & Formatting QA
        run: npm run i18n:qa

      - name: Build Static Site
        run: npm run build

      - name: Run Launch Audit
        run: npm run audit
